name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check src/

      - name: Format check with ruff
        run: ruff format --check src/

      - name: Quick import test
        run: |
          python -c "import pandas; import numpy; import sklearn; import xgboost; import matplotlib; import seaborn; import joblib; print('All imports OK')"
          python src/generate_data.py --days 30 --output /tmp/test.csv
          python src/train.py --data /tmp/test.csv --models linear
          python src/evaluate.py --model models/linear_model.pkl --data /tmp/test.csv
          echo "Pipeline test passed"